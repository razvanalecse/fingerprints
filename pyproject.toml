[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerprint-reconstruction"
version = "0.1.0"
description = "Uncertainty-aware reconstruction of partial fingerprints"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Research-only; dataset licenses apply separately"}
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "pytest-cov>=4,<7"]
eda = ["pandas>=2.0,<3", "matplotlib>=3.7,<4"]
train = [
  "torch>=2.1",
  "torchvision>=0.16",
  "pandas>=2.0",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "opencv-python-headless>=4.8",
  "tqdm>=4.66",
  "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
