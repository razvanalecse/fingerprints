experiment:
  name: fingerprint_autoencoder_kl_f4_mps
  seed: 1729
data:
  image_size: [128, 128]
  observed_fractions: [0.50]
  mask_families: [random_rectangles]
  num_workers: 0
model:
  channels: [32, 64]
  latent_channels: 4
  compression_factor: 4
loss:
  kl_weight: 0.000001
  l1_weight: 1.0
  mse_weight: 0.25
  orientation_weight: 0.02
  gradient_weight: 0.5
  ridge_energy_weight: 0.2
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0002
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  early_stopping_patience: 10
  pilot_epochs: 8
  pilot_train_batches: 64
  pilot_validation_batches: 16
evaluation:
  acceptance:
    validation_roi_psnr_min: 20.0
    validation_roi_ssim_min: 0.65
    validation_orientation_error_max: 0.12
  warning: diffusion training must not start unless codec acceptance is reviewed
