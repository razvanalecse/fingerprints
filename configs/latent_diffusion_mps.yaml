experiment:
  name: conditional_latent_diffusion_socofing_f4_mps
  seed: 1729
data:
  image_size: [128, 128]
  observed_fractions: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80]
  mask_families: [random_rectangles, irregular, central_missing, peripheral_only, central_only, disconnected_fragments, stripes, severe_partial]
  num_workers: 0
autoencoder:
  checkpoint: outputs/latent_autoencoder_full/best-checkpoint.pt
  latent_scale_batches: 32
model:
  channels: [32, 64, 128]
  time_dim: 64
  multiscale_conditioning: false
  middle_attention: false
  attention_heads: 4
diffusion:
  timesteps: 500
  pilot_timesteps: 100
  schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
training:
  epochs: 60
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  early_stopping_patience: 10
  pilot_epochs: 5
  pilot_train_batches: 64
  pilot_validation_batches: 16
  pilot_channels: [16, 32, 64]
  pilot_time_dim: 64
evaluation:
  preview_samples: 4
  preview_ddim_steps: 50
