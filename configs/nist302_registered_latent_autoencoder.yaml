experiment:
  name: nist302_registered_latent_autoencoder_f4
  seed: 1729
data:
  image_size: [128, 128]
model:
  channels: [32, 64]
  latent_channels: 4
  compression_factor: 4
loss:
  kl_weight: 0.000001
  l1_weight: 1.0
  mse_weight: 0.25
  orientation_weight: 0.02
  gradient_weight: 0.5
  ridge_energy_weight: 0.2
training:
  epochs: 25
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  pilot_epochs: 3
  pilot_train_batches: 64
  pilot_validation_batches: 16
evaluation:
  acceptance:
    validation_roi_psnr_min: 15.0
    validation_roi_ssim_min: 0.45
    validation_orientation_error_max: 0.35
  warning: diffusion training must not start unless codec acceptance is reviewed
  note: >
    Acceptance thresholds are relaxed relative to configs/latent_autoencoder_mps.yaml
    (real forensic latents/registered exemplars are far harder to codec-compress
    than clean SOCOFing prints); this is a deliberate SD302-specific calibration,
    not a copy-paste oversight.
