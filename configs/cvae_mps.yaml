experiment:
  name: cvae_socofing_mps
  seed: 1729
data:
  image_size: [128, 128]
  observed_fractions: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80]
  mask_families: [random_rectangles, irregular, central_missing, peripheral_only, central_only, disconnected_fragments, stripes, severe_partial]
  num_workers: 0
model:
  architecture: cvae
  channels: [32, 64, 128, 256]
  latent_dim: 64
loss:
  l1_weight: 1.0
  mse_weight: 0.25
  free_nats_per_dimension: 0.01
training:
  epochs: 60
  batch_size: 24
  learning_rate: 0.0002
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  beta_max: 0.05
  kl_warmup_epochs: 15
  early_stopping_patience: 12
  pilot_epochs: 5
  pilot_train_batches: 64
  pilot_validation_batches: 16
  pilot_channels: [16, 32, 64]
  pilot_latent_dim: 16
evaluation:
  samples_k: [5, 10, 20, 50]
  pilot_samples: 8
