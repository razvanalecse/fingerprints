experiment:
  name: nist302_registered_cvae_global_socofing_transfer
  seed: 1729
data:
  image_size: [128, 128]
  num_workers: 0
  geometric_confidence_report: outputs/nist302_registration/geometric_confidence_calibration_128.json
  ridge_band_report: outputs/nist302_registration/ridge_band_train_128.json
model:
  type: global
  channels: [32, 64, 128, 256]
  latent_dim: 64
  initialize_from: outputs/cvae_full_mps/best-checkpoint.pt
  support_checkpoint: outputs/nist302_visible_support_predictor_full/best-checkpoint.pt
loss:
  l1_weight: 0.25
  mse_weight: 0.05
  free_nats_per_dimension: 0.01
  orientation_weight: 0.35
  orientation_window: 9
  gradient_weight: 0.10
  ridge_energy_weight: 0.10
  ridge_sigma: 1.5
  ridge_energy_window: 17
  ridge_band_weight: 0.25
  ridge_band_orientations: 8
  ridge_band_kernel_size: 17
  ridge_band_pool_size: 9
  ridge_spectrum_weight: 0.50
  ridge_spectrum_temperature: 0.25
  support_background_weight: 0.20
  support_region_weighting: true
training:
  epochs: 20
  batch_size: 4
  learning_rate: 0.00002
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  beta_max: 0.05
  kl_warmup_epochs: 8
  early_stopping_patience: 5
  minimum_improvement: 0.00001
  pilot_epochs: 3
  pilot_channels: [32, 64, 128, 256]
  pilot_latent_dim: 64
  pilot_train_batches: 64
  pilot_validation_batches: 16
evaluation:
  k_values: [5, 10, 20, 50]
  pilot_k_values: [5, 10]
  nominal_coverages: [0.50, 0.80, 0.90, 0.95]
  sample_chunk_size: 5
  preview_samples: 10
  seed: 9173
  support_mode: soft
  support_threshold: 0.5
