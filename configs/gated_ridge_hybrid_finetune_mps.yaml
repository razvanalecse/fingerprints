experiment:
  name: gated_ridge_hybrid_finetune
  seed: 1729
data:
  image_size: [128, 128]
  observed_fractions: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80]
  mask_families: [random_rectangles, irregular, central_missing, peripheral_only, central_only, disconnected_fragments, stripes, severe_partial]
  num_workers: 0
model:
  architecture: gated_conv
  channels: [32, 64, 128, 256]
  upsampling_mode: nearest
  refine_blocks: 0
  enforce_data_consistency: true
loss:
  missing_l1_weight: 1.0
  missing_mse_weight: 0.25
  observed_l1_weight: 0.05
  orientation_weight: 0.10
  orientation_window: 9
  gradient_weight: 0.35
  ridge_energy_weight: 0.0
  band_energy_weight: 0.50
  band_sigma_low: 1.5
  band_sigma_high: 4.0
  fine_energy_weight: 0.30
  fine_sigma: 0.8
  ridge_band_weight: 0.05
  ridge_band_frequencies: [0.10, 0.125, 0.167, 0.20]
  ridge_band_orientations: 8
  ridge_band_kernel_size: 17
  ridge_band_pool_size: 9
  ridge_spectrum_weight: 0.10
  ridge_spectrum_temperature: 0.25
  ridge_sigma: 1.5
  ridge_energy_window: 17
training:
  epochs: 4
  batch_size: 16
  learning_rate: 0.00005
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  early_stopping_patience: 4
  lr_reduce_patience: 2
  lr_reduce_factor: 0.5
  minimum_learning_rate: 0.000001
  minimum_improvement: 0.000001
  pilot_epochs: 1
  pilot_train_batches: 8
  pilot_validation_batches: 4
  # Keep checkpoint-compatible widths even in the bounded pilot.
  pilot_channels: [32, 64, 128, 256]
